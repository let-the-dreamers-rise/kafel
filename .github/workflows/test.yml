name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bison flex
      - name: build and test
        run: make CC=${{ matrix.cc }} && make CC=${{ matrix.cc }} test
      - name: build and test with ASan and UBSan
        run: |
          make clean
          make CC=${{ matrix.cc }} CFLAGS="-std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I${PWD}/include" LDFLAGS="-fsanitize=address,undefined"
          ASAN_OPTIONS=detect_leaks=0 make CC=${{ matrix.cc }} CFLAGS="-std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -I${PWD}/include" LDFLAGS="-fsanitize=address,undefined" test
