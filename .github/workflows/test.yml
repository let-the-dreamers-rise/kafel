name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bison flex
      - name: build and test
        run: make CC=${{ matrix.cc }} && make CC=${{ matrix.cc }} test
      - name: build and test with ASan and UBSan
        env:
          CFLAGS: -g -fsanitize=address,undefined -fno-sanitize-recover=undefined
          ASAN_OPTIONS: detect_leaks=0
        run: |
          make clean
          make CC=${{ matrix.cc }}
          make CC=${{ matrix.cc }} test
